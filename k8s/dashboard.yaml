apiVersion: apps/v1
kind: Deployment
metadata:
  name: airkube-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airkube-dashboard
  template:
    metadata:
      labels:
        app: airkube-dashboard
    spec:
      containers:
        - name: dashboard
          image: demo-ml
          imagePullPolicy: IfNotPresent
          command:
            - streamlit
            - run
            - dashboard.py
            - --server.address=0.0.0.0
            - --server.port=8501
            - --server.headless=true
          ports:
            - containerPort: 8501
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: airkube-dashboard
spec:
  selector:
    app: airkube-dashboard
  ports:
    - name: http
      port: 80
      targetPort: 8501
  type: ClusterIP